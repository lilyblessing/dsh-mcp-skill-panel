name: build

# 纯 registry 自包含构建流水线：本机无需 DSH 闭包（@deepseek-ai/* 作为 devDeps 安装）。
# 链路：typecheck → build(tsdown→tsc dts) → verify → selftest → （main push 时）自动回写 lib 产物。
#
# 关键参数（与本地探针一致）：
#   npm ci --legacy-peer-deps --ignore-scripts
#   - --legacy-peer-deps：registry 上 rc.6/rc.7 peer 图互相咬（ERESOLVE），而运行时 peer 由
#     DSH 闭包注入；类型解析只需包本体在。
#   - --ignore-scripts：防 postinstall；esbuild 走 optionalDependencies 平台二进制，无需脚本。
#
# 产物回写使用 [skip ci] + push paths 不含 lib/**，故不会触发本 workflow 循环。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'tsdown.config.ts'
      - 'cordis.patch.yml'
  # PR 一律触发（不设 paths 过滤）：protect-main ruleset 将 build 列为 required status check，
  # 若因 paths 过滤被跳过，check 会停在 "Expected" 永久阻塞合并（GitHub 官方确认行为）。
  # push 保留 paths 过滤：main 上的 lib 回写提交（仅 lib/**）不触发本工作流，避免自循环。
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsdown -> tsc dts)
        run: npm run build

      - name: Verify artifacts
        run: npm run verify

      - name: Selftest (catalog / preset logic)
        run: node scripts/selftest-mcp.mjs

      - name: Selftest (P1 session-boundary apply chain)
        run: node scripts/selftest-pending.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ github.sha }}
          path: |
            lib/index.js
            lib/catalog.js
            lib/client.js
            lib/mcp-convert.js
            lib/types
          if-no-files-found: error

      - name: Create GitHub App token (for protected main push)
        # protect-main ruleset 要求 PR + status checks：默认 GITHUB_TOKEN 无法直推 main。
        # 以 dsh-ci-bot App token 推送（ruleset bypass list 已授权该 App 整规则集绕过）。
        # 仅 main push 事件执行此步骤：PR 事件（含 fork PR）不触达 secrets 与本步骤。
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Auto-commit rebuilt lib/ artifacts (main push only)
        # 回写只改 lib/**，不在 push paths 内 → 不会重新触发本工作流；
        # actor 守卫（App bot 自身回写不再执行本步骤）为双保险。
        if: >-
          github.ref == 'refs/heads/main' && github.event_name == 'push'
          && github.actor != 'dsh-ci-bot[bot]'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -n "$(git status --porcelain -- lib/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/
            git commit -m "chore: rebuild lib artifacts via CI [skip ci]"
            # actions/checkout 会把 GITHUB_TOKEN 以 http.extraheader 注入 origin，
            # 优先级高于 URL 内凭据 → push 身份仍是 github-actions[bot]（ruleset 无
            # bypass 权限，实测 GH013 拒绝）。先摘除 extraheader，再以 App token push。
            git config --unset-all "http.https://github.com/.extraheader"
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
            echo "lib/ artifacts rebuilt and committed"
          else
            echo "lib/ is in sync, nothing to commit"
          fi
